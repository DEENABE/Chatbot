name: Claude auto-check

# Independent, server-side check for PRs opened by scripts/ship.mjs (or any
# PR into main) — reruns the same three gates on GitHub's infrastructure, so
# a passing local run isn't the only thing standing between a change and
# main. This does NOT auto-merge anything; it just reports pass/fail on the
# PR for the human reviewer to see before approving.

on:
  pull_request:
    branches: [main]

# Cancel a stale run if new commits land on the same PR before this finishes.
concurrency:
  group: claude-auto-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to diff against the base branch

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Diff review
        run: |
          echo "Changed files vs ${{ github.event.pull_request.base.ref }}:"
          git diff --stat origin/${{ github.event.pull_request.base.ref }}...HEAD
          if git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD \
              | grep -Ei '(^|/)\.env($|[/.])|\.pem$|\.key$|id_rsa|credentials|secrets?\.(json|ya?ml)$' \
              | grep -v '\.env\.example$'; then
            echo "::error::Sensitive file path(s) touched in this diff — see above."
            exit 1
          fi
          echo "No sensitive file paths detected."
